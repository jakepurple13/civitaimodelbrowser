name: Android Release Workflow

on:
  push:
    branches:
      - master
    paths-ignore:
      - '.github/**'
    tags-ignore:
      - 'v*'

  pull_request:
    branches:
      - main
      - master

  workflow_call:
  workflow_dispatch:
#    inputs:
#      releaseToGooglePlay:
#        description: 'Release to Google Play?'
#        required: true
#        default: 'false'

#concurrency:
#  group: ${{ github.workflow }}-${{ github.ref }}
#  cancel-in-progress: true

env:
  API_KEY: ${{ secrets.API_KEY }}

jobs:
  baselineProfile:
    name: Generate Baseline Profiles
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - run: |
          echo $CIVIT_SERVICES > android/google-services.json
        env:
          CIVIT_SERVICES: ${{ secrets.CIVIT_SERVICES }}

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: adopt
          java-version: 21

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Build both APKs before the emulator boots, then stop the Gradle and Kotlin daemons so
      # they don't compete with the emulator for memory (the emulator was being killed mid-test)
      - name: Build Profile APKs
        run: |
          ./gradlew :android:assembleNonMinifiedRelease :baselineprofile:assembleNonMinifiedRelease -PincludeEmulatorAbis --console=plain
          ./gradlew --stop
          pkill -f KotlinCompileDaemon || true
          free -m

      # The runner image ships emulator 37.2.12, which died mid-test with the swiftshader GLES
      # renderer; the same journey passes on 37.3.x with swangle
      - name: Update Android Emulator
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install emulator > /dev/null

      # The emulator is x86_64, so include the emulator ABI for this job only.
      # Release builds below don't pass this flag and stay arm64-only.
      - name: Generate Baseline and Startup Profiles
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          cores: 4
          disk-size: 6000M
          disable-animations: true
          emulator-options: -no-window -gpu swangle_indirect -noaudio -no-boot-anim -camera-back none
          # Each script line runs in its own shell, so logcat and Gradle share one line
          script: adb logcat -c && (adb logcat -v threadtime > logcat.txt &) && ./gradlew :android:generateReleaseBaselineProfile -PincludeEmulatorAbis --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: baseline-profiles
          path: android/src/release/generated/baselineProfiles/

      - name: Check for OOM kills
        if: failure()
        run: |
          free -m
          sudo dmesg | grep -iE 'out of memory|oom|killed process' || echo "No OOM kills found"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: baseline-profile-test-results
          path: |
            baselineprofile/build/outputs/
            logcat.txt

  aab:
    name: Generate AAB
    timeout-minutes: 60
    continue-on-error: true
    needs: baselineProfile
    # Still build when profile generation fails; the committed profiles are used instead
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download Baseline Profiles
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: baseline-profiles
          path: android/src/release/generated/baselineProfiles/

      - run: |
          echo $CIVIT_SERVICES > android/google-services.json
        env:
          CIVIT_SERVICES: ${{ secrets.CIVIT_SERVICES }}

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: adopt
          java-version: 21

      - name: Get tag name
        id: get_tag_name
        run: |
          set -x
          echo "VERSION_TAG=${GITHUB_REF/refs\/tags\//}" >> $GITHUB_ENV

      - name: Export Libraries
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: current
          arguments: "exportLibraryDefinitions"

      - name: Build Artifacts
        id: buildApks
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: current
          wrapper-cache-enabled: true
          dependencies-cache-enabled: true
          configuration-cache-enabled: true
          arguments: android:bundleRelease

      - uses: kevin-david/zipalign-sign-android-release@v2.0.1
        name: Sign app APK
        id: civit_browser_sign
        with:
          releaseDirectory: android/build/outputs/bundle/release/
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Clean up build artifacts
        run: |
          cp ${{ steps.civit_browser_sign.outputs.signedReleaseFile }} civitbrowser-release.aab

      - uses: actions/upload-artifact@v4
        with:
          name: Signed Civit App
          path: civitbrowser-release.aab

  aabMinified:
    name: Generate Minified AAB
    timeout-minutes: 60
    continue-on-error: true
    needs: baselineProfile
    # Still build when profile generation fails; the committed profiles are used instead
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download Baseline Profiles
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: baseline-profiles
          path: android/src/release/generated/baselineProfiles/

      - run: |
          echo $CIVIT_SERVICES > android/google-services.json
        env:
          CIVIT_SERVICES: ${{ secrets.CIVIT_SERVICES }}

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: adopt
          java-version: 21

      - name: Get tag name
        id: get_tag_name
        run: |
          set -x
          echo "VERSION_TAG=${GITHUB_REF/refs\/tags\//}" >> $GITHUB_ENV

      - name: Export Libraries
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: current
          arguments: "exportLibraryDefinitions"

      - name: Build Artifacts
        id: buildApks
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: current
          wrapper-cache-enabled: true
          dependencies-cache-enabled: true
          configuration-cache-enabled: true
          arguments: android:bundleReleaseMinified

      - uses: kevin-david/zipalign-sign-android-release@v2.0.1
        name: Sign app APK
        id: civit_browser_sign
        with:
          releaseDirectory: android/build/outputs/bundle/releaseMinified/
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Clean up build artifacts
        run: |
          cp ${{ steps.civit_browser_sign.outputs.signedReleaseFile }} civitbrowser-minified-release.aab

      - uses: actions/upload-artifact@v4
        with:
          name: Signed Minified Civit App
          path: civitbrowser-minified-release.aab


  apk:
    name: Generate Apk
    timeout-minutes: 60
    continue-on-error: true
    needs: baselineProfile
    # Still build when profile generation fails; the committed profiles are used instead
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download Baseline Profiles
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: baseline-profiles
          path: android/src/release/generated/baselineProfiles/

      - run: |
          echo $CIVIT_SERVICES > android/google-services.json
        env:
          CIVIT_SERVICES: ${{ secrets.CIVIT_SERVICES }}

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: adopt
          java-version: 21

      - name: Get tag name
        id: get_tag_name
        run: |
          set -x
          echo "VERSION_TAG=${GITHUB_REF/refs\/tags\//}" >> $GITHUB_ENV

      - name: Export Libraries
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: current
          arguments: "exportLibraryDefinitions"

      - name: Build Artifacts
        id: buildApks
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: current
          wrapper-cache-enabled: true
          dependencies-cache-enabled: true
          configuration-cache-enabled: true
          arguments: android:assembleRelease

      - uses: kevin-david/zipalign-sign-android-release@v2.0.1
        name: Sign app APK
        id: civit_apk_sign
        with:
          releaseDirectory: android/build/outputs/apk/release/
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          # override default build-tools version (33.0.0) -- optional
          BUILD_TOOLS_VERSION: "34.0.0"

      - name: Clean up build artifacts
        run: |
          cp ${{ steps.civit_apk_sign.outputs.signedReleaseFile }} civit-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Signed Civit Apk
          path: civit-release.apk

  apkMinified:
    name: Generate Minified Apk
    timeout-minutes: 60
    continue-on-error: true
    needs: baselineProfile
    # Still build when profile generation fails; the committed profiles are used instead
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download Baseline Profiles
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: baseline-profiles
          path: android/src/release/generated/baselineProfiles/

      - run: |
          echo $CIVIT_SERVICES > android/google-services.json
        env:
          CIVIT_SERVICES: ${{ secrets.CIVIT_SERVICES }}

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: adopt
          java-version: 21

      - name: Get tag name
        id: get_tag_name
        run: |
          set -x
          echo "VERSION_TAG=${GITHUB_REF/refs\/tags\//}" >> $GITHUB_ENV

      - name: Export Libraries
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: current
          arguments: "exportLibraryDefinitions"

      - name: Build Minified Artifacts
        id: buildApks
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: current
          wrapper-cache-enabled: true
          dependencies-cache-enabled: true
          configuration-cache-enabled: true
          arguments: android:assembleReleaseMinified

      - uses: kevin-david/zipalign-sign-android-release@v2.0.1
        name: Sign minified app APK
        id: civit_minified_apk_sign
        with:
          releaseDirectory: android/build/outputs/apk/releaseMinified/
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          # override default build-tools version (33.0.0) -- optional
          BUILD_TOOLS_VERSION: "34.0.0"

      - name: Clean up build artifacts
        run: |
          cp ${{ steps.civit_minified_apk_sign.outputs.signedReleaseFile }} civit-release-minified.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Signed Minified Civit Apk
          path: civit-release-minified.apk